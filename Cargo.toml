[package]
name = "acx"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
dirs = "6.0"
html2md = "0.2"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["blocking", "cookies", "gzip", "brotli", "deflate"] }
regex = "1.11"
rpassword = "7.3"
scraper = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
